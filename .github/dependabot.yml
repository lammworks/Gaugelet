version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Panama
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - swiftpm

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Panama
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
