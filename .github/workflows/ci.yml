name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaugelet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shipping-check:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.33
          enable-cache: false

      - name: Record toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          xcrun --find actool

      - name: Bootstrap hash-pinned DMG tools
        run: ./Scripts/bootstrap-dmg-tools.sh

      - name: Verify Gaugelet shipping path
        env:
          GAUGELET_REQUIRE_ASSET_CATALOG: "1"
        run: ./Scripts/check.sh

      - name: Verify shell syntax and executable bits
        run: |
          set -euo pipefail
          zsh -n Scripts/*.sh
          while IFS= read -r script; do
            test -x "$script"
          done < <(find Scripts -maxdepth 1 -type f \( -name '*.sh' -o -name '*.py' \) -print | sort)

      - name: Verify Python syntax
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/gaugelet-pycache" \
            python3 -m compileall -q Scripts Packaging/dmg_settings.py

      - name: Name the unsigned test DMG
        id: unsigned-dmg
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -f build/candidate/Gaugelet.dmg
          # The candidate packager ad-hoc signs so the existing DMG checks can
          # verify the bundle. It does not use a Developer ID identity, a
          # keychain, or notarization, and this step does not publish a release.
          echo "name=Gaugelet-unsigned-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned test DMG
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.unsigned-dmg.outputs.name }}
          path: build/candidate/Gaugelet.dmg
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  website-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install launch-site dependencies
        working-directory: website
        run: npm ci

      - name: Lint and verify the launch site
        working-directory: website
        run: |
          npm run lint
          npm test
