name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaugelet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shipping-check:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.33
          enable-cache: false

      - name: Record toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          xcrun --find actool

      - name: Bootstrap hash-pinned DMG tools
        run: ./Scripts/bootstrap-dmg-tools.sh

      - name: Verify Gaugelet shipping path
        env:
          GAUGELET_REQUIRE_ASSET_CATALOG: "1"
        run: ./Scripts/check.sh

      - name: Verify shell syntax and executable bits
        run: |
          set -euo pipefail
          zsh -n Scripts/*.sh
          while IFS= read -r script; do
            test -x "$script"
          done < <(find Scripts -maxdepth 1 -type f \( -name '*.sh' -o -name '*.py' \) -print | sort)

      - name: Verify Python syntax
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/gaugelet-pycache" \
            python3 -m compileall -q Scripts Packaging/dmg_settings.py

  website-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install launch-site dependencies
        working-directory: website
        run: npm ci

      - name: Lint and verify the launch site
        working-directory: website
        run: |
          npm run lint
          npm test
