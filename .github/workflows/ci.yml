name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaugelet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shipping-check:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.11.33
          enable-cache: false

      - name: Record toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          xcrun --find actool

      - name: Bootstrap hash-pinned DMG tools
        run: ./Scripts/bootstrap-dmg-tools.sh

      - name: Verify Gaugelet shipping path
        env:
          GAUGELET_REQUIRE_ASSET_CATALOG: "1"
        run: ./Scripts/check.sh

      - name: Verify shell syntax and executable bits
        run: |
          set -euo pipefail
          zsh -n Scripts/*.sh
          while IFS= read -r script; do
            test -x "$script"
          done < <(find Scripts -maxdepth 1 -type f \( -name '*.sh' -o -name '*.py' \) -print | sort)

      - name: Verify Python syntax
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/gaugelet-pycache" \
            python3 -m compileall -q Scripts Packaging/dmg_settings.py

  website-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install launch-site dependencies
        working-directory: website
        run: npm ci

      - name: Lint and verify the launch site
        working-directory: website
        run: |
          npm run lint
          npm test
