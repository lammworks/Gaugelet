name: "Dormant: Developer ID notarized build"

on:
  workflow_dispatch:
    inputs:
      confirm_membership:
        description: Type ACTIVE APPLE MEMBERSHIP to enable the dormant path
        required: true
        type: string
      confirm_version:
        description: Type the exact version in Packaging/Info.plist
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gaugelet-developer-id-build
  cancel-in-progress: false

jobs:
  notarized-dmg:
    runs-on: macos-15
    timeout-minutes: 60
    environment: developer-id-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.33
          enable-cache: false

      - name: Confirm dormant path and requested version
        env:
          CONFIRM_MEMBERSHIP: ${{ inputs.confirm_membership }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          test "$CONFIRM_MEMBERSHIP" = "ACTIVE APPLE MEMBERSHIP"
          test "$CONFIRM_VERSION" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"

      - name: Bootstrap hash-pinned DMG tools
        run: ./Scripts/bootstrap-dmg-tools.sh

      - name: Import protected Apple credentials into an ephemeral Keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${P12_BASE64:?Missing Developer ID certificate}"
          : "${P12_PASSWORD:?Missing certificate password}"
          : "${API_KEY_BASE64:?Missing App Store Connect API key}"
          : "${API_KEY_ID:?Missing App Store Connect key ID}"
          : "${API_ISSUER_ID:?Missing App Store Connect issuer ID}"

          KEYCHAIN_PATH="${RUNNER_TEMP}/gaugelet-release.keychain-db"
          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id-application.p12"
          API_KEY_PATH="${RUNNER_TEMP}/AuthKey_${API_KEY_ID}.p8"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          NOTARY_PROFILE="GaugeletNotary-${GITHUB_RUN_ID}"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          {
            echo "GAUGELET_SIGNING_KEYCHAIN=${KEYCHAIN_PATH}"
            echo "GAUGELET_SIGNING_CERTIFICATE_PATH=${CERTIFICATE_PATH}"
            echo "GAUGELET_NOTARY_API_KEY_PATH=${API_KEY_PATH}"
          } >> "$GITHUB_ENV"

          printf '%s' "$P12_BASE64" | /usr/bin/base64 --decode -o "$CERTIFICATE_PATH"
          printf '%s' "$API_KEY_BASE64" | /usr/bin/base64 --decode -o "$API_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$API_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F\" '/Developer ID Application:/ { print $2; found = 1 } END { if (!found) exit 1 }')"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --key "$API_KEY_PATH" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --keychain "$KEYCHAIN_PATH"
          {
            echo "GAUGELET_SIGNING_IDENTITY=${SIGNING_IDENTITY}"
            echo "GAUGELET_NOTARY_PROFILE=${NOTARY_PROFILE}"
            echo "GAUGELET_NOTARY_KEYCHAIN=${KEYCHAIN_PATH}"
          } >> "$GITHUB_ENV"

      - name: Build, notarize, staple, and verify without publishing
        run: ./Scripts/release-notarized.sh

      - name: Upload notarized assets for owner review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Gaugelet-${{ inputs.confirm_version }}-developer-id-review
          path: build/notarized-release/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Remove ephemeral Keychain
        if: always()
        run: |
          if [[ -n "${GAUGELET_SIGNING_KEYCHAIN:-}" && -f "${GAUGELET_SIGNING_KEYCHAIN}" ]]; then
            security delete-keychain "$GAUGELET_SIGNING_KEYCHAIN"
          fi
          for credential_path in \
            "${GAUGELET_SIGNING_CERTIFICATE_PATH:-}" \
            "${GAUGELET_NOTARY_API_KEY_PATH:-}"; do
            if [[ -n "$credential_path" && -f "$credential_path" ]]; then
              /bin/rm -f "$credential_path"
            fi
          done

      - name: State publication boundary
        run: echo "No GitHub Release was created or published."
