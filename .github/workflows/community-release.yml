name: Build and attest community release assets

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Type 1.0.0 to build the immutable community asset set
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gaugelet-community-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.33
          enable-cache: false

      - name: Confirm version and clean source
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          test "$CONFIRM_VERSION" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)" = "$CONFIRM_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Packaging/Info.plist)" = "1"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Bootstrap hash-pinned DMG tools
        run: ./Scripts/bootstrap-dmg-tools.sh

      - name: Build verified ad-hoc community assets
        run: ./Scripts/release.sh

      - name: Attest CI-built release assets when repository policy supports it
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            build/release/Gaugelet.dmg
            build/release/Gaugelet.dmg.sha256
            build/release/Gaugelet.app.dSYM.zip
            build/release/build-evidence.txt
            build/release/release-evidence.txt

      - name: Upload immutable CI artifact for local Sparkle finalization
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Gaugelet-1.0.0-community-unsigned-feed
          path: build/release/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: State publication boundary
        run: |
          set -euo pipefail
          test ! -e build/release/appcast.xml
          echo "CI produced and optionally attested ad-hoc assets only."
          echo "The release owner must generate appcast.xml locally with the Keychain-backed Sparkle key."
          echo "This workflow does not create or publish a GitHub Release."
