name: Feature request
description: Propose a focused improvement to Gaugelet
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    attributes:
      label: Problem to solve
      description: Describe the micro-decision or blocked workflow this would improve.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
      description: Describe what success looks like without prescribing implementation unless necessary.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Area
      options:
        - Usage counters
        - Menu bar and appearance
        - Notifications
        - Launch at Login
        - Sparkle updates
        - Installation and documentation
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Note any lower-maintenance workaround you already tried.
